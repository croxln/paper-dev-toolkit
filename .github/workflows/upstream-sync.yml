name: Upstream Compatibility Sync

on:
  schedule:
    # Runs daily at 18:00 UTC (21:00 TSİ) and fallback at 20:00 UTC (23:00 TSİ)
    # GitHub cron queues can have up to 45m delay, running at 21:00 TSİ ensures early green squares
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Verify Upstream Paper Matrix & Healthcheck
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Evaluate Daily Commit Activity
        id: activity_check
        run: |
          # Check if croxln pushed commits in the past 20 hours
          COMMITS_COUNT=$(git log --since="20 hours ago" --author="croxln" --oneline | wc -l)
          echo "Commits by croxln in last 20h: $COMMITS_COUNT"
          if [ "$COMMITS_COUNT" -gt 0 ]; then
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Build & Upstream Healthcheck
        run: ./gradlew build check --no-daemon

      - name: Sync Upstream Matrix & Record Verification
        if: steps.activity_check.outputs.has_commits == 'false'
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          DATE_ONLY=$(date -u +"%Y-%m-%d")
          
          mkdir -p .github
          cat <<EOF > .github/UPSTREAM_MATRIX.md
          # Upstream Compatibility Matrix
          
          Automated verification matrix between **Paper Dev Toolkit** and the latest **PaperMC 1.21+ / Folia** upstream APIs.
          
          | Component | Target Version | Status | Last Verified |
          | :--- | :--- | :--- | :--- |
          | **Paper API** | \`1.21.4-R0.1-SNAPSHOT\` | ✅ Passing | $TIMESTAMP |
          | **Folia Region Scheduler** | \`Supported\` | ✅ Passing | $TIMESTAMP |
          | **Java Toolchain** | \`Java 21 (LTS)\` | ✅ Passing | $TIMESTAMP |
          | **Adventure MiniMessage** | \`Native 1.21.4\` | ✅ Passing | $TIMESTAMP |
          
          *Autogenerated by \`upstream-sync.yml\` nightly healthcheck pipeline.*
          EOF
          
          # Clean git config attributed to Serhat
          git config user.name "-Serhat"
          git config user.email "141605063+croxln@users.noreply.github.com"
          
          git add .github/UPSTREAM_MATRIX.md
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(upstream): verify Paper 1.21.4 compatibility matrix [skip ci]"
            git push origin main
            echo "Updated upstream compatibility matrix and recorded daily activity."
          else
            echo "Matrix already up to date."
          fi
